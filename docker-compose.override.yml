services:
  php:
    build:
      target: app_php_dev
    volumes:
      - ./:/srv/app
      - ./docker/php/conf.d/app.dev.ini:/usr/local/etc/php/conf.d/app.dev.ini:ro
      - storage_data:/srv/app/var/storage
    environment:
      APP_ENV: dev
      XDEBUG_MODE: "${XDEBUG_MODE:-off}"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  worker:
    build:
      target: app_php_dev
    volumes:
      - ./:/srv/app
    environment:
      APP_ENV: dev

  caddy:
    volumes:
      - ./public:/srv/app/public:ro

  database:
    ports:
      - "${POSTGRES_PORT:-5433}:5432"

  mailer:
    image: axllent/mailpit:latest
    container_name: owner_mailer
    restart: unless-stopped
    ports:
      - "1026:1025"
      - "8026:8025"